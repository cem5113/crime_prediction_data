name: Post Processing (FR)

on:
  workflow_run:
    workflows: ["Full SF Crime Pipeline"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: post-processing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run_fr:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      CRIME_DATA_DIR: ${{ github.workspace }}/crime_prediction_data
      ARTIFACT_ZIP: artifact/sf-crime-pipeline-output.zip
      ARTIFACT_DIR: artifact
      FR_OUTPUT_DIR: ${{ github.workspace }}/crime_prediction_data
      FALLBACK_DIRS: ${{ github.workspace }},${{ github.workspace }}/crime_prediction_data

      # 🔽 ÖNEMLİ: FR script için env değişkenleri
      FR_EVENTS_PATH: ${{ github.workspace }}/artifact/sf_crime_y.csv
      FR_LABEL_PATH:  ${{ github.workspace }}/artifact/sf_crime_L.csv
      FR_OUT_PATH:    ${{ github.workspace }}/fr_crime.csv
      FR_MIRROR_DIR:  ${{ github.workspace }}/crime_prediction_data
      FR_YCOL:        Y_label
      FR_AUTOFIND_LABEL: "1"

      WX_LOCATION: "paris"
      WX_UNIT: "metric"
      GEOID_LEN: "11"
      PATROL_HORIZON_DAYS: "1"
      PATROL_TOP_K: "50"
      FAST_MODE: "1"
      SKIP_CV: "1"
      REUSE_MODELS: "1"
      BASE_MODELS: "hgb,lgb"
      FOLDS_SELECT: "2"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure base dirs
        shell: bash
        run: |
          set -euo pipefail
          echo "GITHUB_WORKSPACE=${GITHUB_WORKSPACE}"
          echo "CRIME_DATA_DIR=${CRIME_DATA_DIR}"
          mkdir -p "${CRIME_DATA_DIR}"
          mkdir -p "${ARTIFACT_DIR}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies (project)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -U pip wheel setuptools
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Install parquet engine and data libs
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -U pandas pyarrow

      - name: Download upstream artifact (from triggering run)
        uses: dawidd6/action-download-artifact@v6
        with:
          run_id: ${{ github.event.workflow_run.id }}
          name: sf-crime-pipeline-output
          path: artifact

      - name: Show artifact tree (debug)
        shell: bash
        run: |
          set -euo pipefail
          echo "=== artifact/ (after download) ==="
          ls -lahR artifact || true

      - name: Unzip artifact if present (optional)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "${{ env.ARTIFACT_ZIP }}" ]; then
            command -v unzip >/dev/null 2>&1 || { sudo apt-get update -y >/dev/null && sudo apt-get install -y unzip >/dev/null; }
            echo "Unzipping: ${ARTIFACT_ZIP} -> ${ARTIFACT_DIR}"
            unzip -o "${ARTIFACT_ZIP}" -d "${ARTIFACT_DIR}"
          else
            echo "No artifact ZIP file found (this is fine)."
          fi
          echo "=== artifact/ (after optional unzip) ==="
          ls -lahR artifact || true

      - name: FR 00) Base grid / event label merge
        env:
          CRIME_DATA_DIR: ${{ env.CRIME_DATA_DIR }}
          ARTIFACT_ZIP:   ${{ env.ARTIFACT_ZIP }}
          ARTIFACT_DIR:   ${{ env.ARTIFACT_DIR }}
          FR_OUTPUT_DIR:  ${{ env.FR_OUTPUT_DIR }}
          FALLBACK_DIRS:  ${{ env.FALLBACK_DIRS }}

          # Bu adımda da FR_* env'leri görünür olsun (opsiyonel ama net):
          FR_EVENTS_PATH: ${{ env.FR_EVENTS_PATH }}
          FR_LABEL_PATH:  ${{ env.FR_LABEL_PATH }}
          FR_OUT_PATH:    ${{ env.FR_OUT_PATH }}
          FR_MIRROR_DIR:  ${{ env.FR_MIRROR_DIR }}
          FR_YCOL:        ${{ env.FR_YCOL }}
          FR_AUTOFIND_LABEL: ${{ env.FR_AUTOFIND_LABEL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f update_crime_fr.py ]; then
            PY=update_crime_fr.py
          elif [ -f scripts/update_crime_fr.py ]; then
            PY=scripts/update_crime_fr.py
          else
            echo "⚠️ update_crime_fr.py yok, adım atlanıyor"
            exit 0
          fi
          python -u "$PY"
          echo "HEAD sf_crime_grid_full_labeled.csv:"; head -n 5 "./sf_crime_grid_full_labeled.csv" || true
          echo "HEAD fr_crime.csv (mirror):"; head -n 5 "$GITHUB_WORKSPACE/crime_prediction_data/fr_crime.csv" || true

      - name: FR 01) 911
        env:
          CRIME_DATA_DIR: ${{ env.CRIME_DATA_DIR }}
          ARTIFACT_ZIP:   ${{ env.ARTIFACT_ZIP }}
          ARTIFACT_DIR:   ${{ env.ARTIFACT_DIR }}
          FR_OUTPUT_DIR:  ${{ env.FR_OUTPUT_DIR }}
          FALLBACK_DIRS:  ${{ env.FALLBACK_DIRS }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f update_911_fr.py ]; then
            PY=update_911_fr.py
          elif [ -f scripts/update_911_fr.py ]; then
            PY=scripts/update_911_fr.py
          else
            echo "⚠️ update_911_fr.py yok, adım atlanıyor"
            exit 0
          fi
          python -u "$PY" || true
          echo "HEAD fr_crime_01.csv:"; head -n 5 "$GITHUB_WORKSPACE/crime_prediction_data/fr_crime_01.csv" || true

      - name: FR 02) 311
        env:
          CRIME_DATA_DIR: ${{ env.CRIME_DATA_DIR }}
          ARTIFACT_ZIP:   ${{ env.ARTIFACT_ZIP }}
          ARTIFACT_DIR:   ${{ env.ARTIFACT_DIR }}
          FR_OUTPUT_DIR:  ${{ env.FR_OUTPUT_DIR }}
          FALLBACK_DIRS:  ${{ env.FALLBACK_DIRS }}
          FR_311_IN:      ${{ env.ARTIFACT_DIR }}/sf_311_last_5_years.csv
          FR_311_IN_PQ:   ${{ env.ARTIFACT_DIR }}/sf_311_last_5_years.parquet
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "${FR_311_IN_PQ}" ]; then
            export FR_311_IN="${FR_311_IN_PQ}"
          fi
          python -u update_311_fr.py || true
          echo "HEAD fr_crime_02.csv:"; head -n 5 "$GITHUB_WORKSPACE/crime_prediction_data/fr_crime_02.csv" || true

      - name: FR 03) Population
        env:
          CRIME_DATA_DIR: ${{ env.CRIME_DATA_DIR }}
          ARTIFACT_ZIP:   ${{ env.ARTIFACT_ZIP }}
          ARTIFACT_DIR:   ${{ env.ARTIFACT_DIR }}
          FR_OUTPUT_DIR:  ${{ env.FR_OUTPUT_DIR }}
          FALLBACK_DIRS:  ${{ env.FALLBACK_DIRS }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f update_population_fr.py ]; then
            PY=update_population_fr.py
          elif [ -f scripts/update_population_fr.py ]; then
            PY=scripts/update_population_fr.py
          else
            echo "⚠️ update_population_fr.py yok, adım atlanıyor"
            exit 0
          fi
          python -u "$PY" || true
          echo "HEAD fr_crime_03.csv:"; head -n 5 "$GITHUB_WORKSPACE/crime_prediction_data/fr_crime_03.csv" || true

      - name: FR 04) Bus
        env:
          CRIME_DATA_DIR: ${{ env.CRIME_DATA_DIR }}
          ARTIFACT_ZIP:   ${{ env.ARTIFACT_ZIP }}
          ARTIFACT_DIR:   ${{ env.ARTIFACT_DIR }}
          FR_OUTPUT_DIR:  ${{ env.FR_OUTPUT_DIR }}
          FALLBACK_DIRS:  ${{ env.FALLBACK_DIRS }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f update_bus_fr.py ]; then
            PY=update_bus_fr.py
          elif [ -f scripts/update_bus_fr.py ]; then
            PY=scripts/update_bus_fr.py
          else
            echo "⚠️ update_bus_fr.py yok, adım atlanıyor"
            exit 0
          fi
          python -u "$PY" || true
          echo "HEAD fr_crime_04.csv:"; head -n 5 "$GITHUB_WORKSPACE/crime_prediction_data/fr_crime_04.csv" || true

      - name: FR 05) Train
        env:
          CRIME_DATA_DIR: ${{ env.CRIME_DATA_DIR }}
          ARTIFACT_ZIP:   ${{ env.ARTIFACT_ZIP }}
          ARTIFACT_DIR:   ${{ env.ARTIFACT_DIR }}
          FR_OUTPUT_DIR:  ${{ env.FR_OUTPUT_DIR }}
          FALLBACK_DIRS:  ${{ env.FALLBACK_DIRS }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f update_train_fr.py ]; then
            PY=update_train_fr.py
          elif [ -f scripts/update_train_fr.py ]; then
            PY=scripts/update_train_fr.py
          else
            echo "⚠️ update_train_fr.py yok, adım atlanıyor"
            exit 0
          fi
          python -u "$PY" || true
          echo "HEAD fr_crime_05.csv:"; head -n 5 "$GITHUB_WORKSPACE/crime_prediction_data/fr_crime_05.csv" || true

      - name: FR 06) POI
        env:
          CRIME_DATA_DIR: ${{ env.CRIME_DATA_DIR }}
          ARTIFACT_ZIP:   ${{ env.ARTIFACT_ZIP }}
          ARTIFACT_DIR:   ${{ env.ARTIFACT_DIR }}
          FR_OUTPUT_DIR:  ${{ env.FR_OUTPUT_DIR }}
          FALLBACK_DIRS:  ${{ env.FALLBACK_DIRS }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f update_poi_fr.py ]; then
            PY=update_poi_fr.py
          elif [ -f scripts/update_poi_fr.py ]; then
            PY=scripts/update_poi_fr.py
          else
            echo "⚠️ update_poi_fr.py yok, adım atlanıyor"
            exit 0
          fi
          python -u "$PY" || true
          echo "HEAD fr_crime_06.csv:"; head -n 5 "$GITHUB_WORKSPACE/crime_prediction_data/fr_crime_06.csv" || true

      - name: FR 07) Police & Gov
        env:
          CRIME_DATA_DIR: ${{ env.CRIME_DATA_DIR }}
          ARTIFACT_ZIP:   ${{ env.ARTIFACT_ZIP }}
          ARTIFACT_DIR:   ${{ env.ARTIFACT_DIR }}
          FR_OUTPUT_DIR:  ${{ env.FR_OUTPUT_DIR }}
          FALLBACK_DIRS:  ${{ env.FALLBACK_DIRS }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f update_police_gov_fr.py ]; then
            PY=update_police_gov_fr.py
          elif [ -f scripts/update_police_gov_fr.py ]; then
            PY=scripts/update_police_gov_fr.py
          else
            echo "⚠️ update_police_gov_fr.py yok, adım atlanıyor"
            exit 0
          fi
          python -u "$PY" || true
          echo "HEAD fr_crime_07.csv:"; head -n 5 "$GITHUB_WORKSPACE/crime_prediction_data/fr_crime_07.csv" || true

      - name: FR 08) Weather
        env:
          CRIME_DATA_DIR: ${{ env.CRIME_DATA_DIR }}
          ARTIFACT_ZIP:   ${{ env.ARTIFACT_ZIP }}
          ARTIFACT_DIR:   ${{ env.ARTIFACT_DIR }}
          FR_OUTPUT_DIR:  ${{ env.FR_OUTPUT_DIR }}
          FALLBACK_DIRS:  ${{ env.FALLBACK_DIRS }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f update_weather_fr.py ]; then
            PY=update_weather_fr.py
          elif [ -f scripts/update_weather_fr.py ]; then
            PY=scripts/update_weather_fr.py
          else
            echo "⚠️ update_weather_fr.py yok, adım atlanıyor"
            exit 0
          fi
          python -u "$PY" || true
          echo "HEAD fr_crime_08.csv:"; head -n 5 "$GITHUB_WORKSPACE/crime_prediction_data/fr_crime_08.csv" || true

      - name: FR 09) Neighbors
        env:
          CRIME_DATA_DIR: ${{ env.CRIME_DATA_DIR }}
          ARTIFACT_DIR:   ${{ env.ARTIFACT_DIR }}
          FR_OUTPUT_DIR:  ${{ env.FR_OUTPUT_DIR }}
          FALLBACK_DIRS:  ${{ env.FALLBACK_DIRS }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/make_neighbors_fr.py ]; then
            PY=scripts/make_neighbors_fr.py
          elif [ -f make_neighbors_fr.py ]; then
            PY=make_neighbors_fr.py
          else
            echo "⚠️ make_neighbors_fr.py bulunamadı, adım atlanıyor."
            exit 0
          fi
          python -u "$PY" || true
          echo "HEAD fr_crime_09.csv:"; head -n 5 "$GITHUB_WORKSPACE/crime_prediction_data/fr_crime_09.csv" || true

      - name: Download latest trained models (from weekly workflow)
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: train_weekly.yml
          workflow_conclusion: success
          branch: main
          name: sutam-models
          path: ${{ env.CRIME_DATA_DIR }}/models
          if_no_artifact_found: ignore

      - name: FR 09.5) Feature analysis → fr_crime_10.csv
        shell: bash
        env:
          CRIME_DATA_DIR: ${{ env.CRIME_DATA_DIR }}
        run: |
          set -euo pipefail

          echo "📦 Deps: shap / xgboost / lightgbm / sklearn / pandas / numpy"
          python -m pip install -U pip wheel setuptools
          pip install shap==0.46.0 matplotlib==3.9.2 scikit-learn joblib pandas numpy
          pip install xgboost lightgbm || true

          export FEATURE_DATASET="${CRIME_DATA_DIR}/fr_crime_09.csv"
          export OUTPUT_DIR="${CRIME_DATA_DIR}"
          export DISABLE_QUARTILES="1"
          export CRIME_CSV_FR="${CRIME_DATA_DIR}/fr_crime_09.csv"

          PY=""
          if [ -f "${CRIME_DATA_DIR}/run_feature_analysis_fr.py" ]; then
            PY="${CRIME_DATA_DIR}/run_feature_analysis_fr.py"
          elif [ -f "${CRIME_DATA_DIR}/scripts/run_feature_analysis_fr.py" ]; then
            PY="${CRIME_DATA_DIR}/scripts/run_feature_analysis_fr.py"
          elif [ -f "run_feature_analysis_fr.py" ]; then
            PY="run_feature_analysis_fr.py"
          elif [ -f "scripts/run_feature_analysis_fr.py" ]; then
            PY="scripts/run_feature_analysis_fr.py"
          else
            echo "⚠️ run_feature_analysis_fr.py bulunamadı, fr_crime_09.csv → fr_crime_10.csv kopyalanıyor."
            cp -f "${CRIME_DATA_DIR}/fr_crime_09.csv" "${CRIME_DATA_DIR}/fr_crime_10.csv"
            exit 0
          fi

          echo "🚀 Özellik analizi çalışıyor: $PY"
          python -u "$PY"

          # Script fr_crime_10.csv'yi yazdı mı?
          if [ -s "${CRIME_DATA_DIR}/fr_crime_10.csv" ]; then
            echo "✅ fr_crime_10.csv hazır (run_feature_analysis_fr.py çıktısı)."
          else
            echo "⚠️ fr_crime_10.csv bulunamadı, güvenlik için fr_crime_09.csv kopyalanıyor."
            cp -f "${CRIME_DATA_DIR}/fr_crime_09.csv" "${CRIME_DATA_DIR}/fr_crime_10.csv"
          fi

          echo "HEAD fr_crime_10.csv:"
          head -n 5 "${CRIME_DATA_DIR}/fr_crime_10.csv" || true

      # ─────────────────────────────────────────────────────────
      # Gate + stacking (fr_crime_10.csv ile)
      # ─────────────────────────────────────────────────────────
      - name: Gate (always proceed)
        id: gate
        shell: bash
        run: echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Decide if training is needed (models present?)
        id: need_train
        shell: bash
        env:
          MODELS_DIR:   ${{ env.CRIME_DATA_DIR }}/models
          REUSE_MODELS: ${{ env.REUSE_MODELS }}
        run: |
          set -euo pipefail
          NEED="true"
          if [ "${REUSE_MODELS:-1}" = "1" ] && [ -d "${MODELS_DIR}" ] && ls "${MODELS_DIR}"/stacking_*.joblib >/dev/null 2>&1; then
            NEED="false"
          fi
          echo "need=${NEED}" >> "$GITHUB_OUTPUT"
          echo "NEED_TRAIN=${NEED}"

      - name: Install ML deps for stacking
        if: ${{ steps.gate.outputs.proceed == 'true' && steps.need_train.outputs.need == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "📦 Installing ML dependencies (sklearn, lgbm, xgb)"
          python -m pip install -U pip wheel setuptools
          pip install scikit-learn==1.4.2 joblib pandas numpy
          pip install lightgbm xgboost || true

      - name: FR 10.2) Run stacking (select + final) on fr_crime_10.csv
        if: ${{ steps.gate.outputs.proceed == 'true' && steps.need_train.outputs.need == 'true' }}
        shell: bash
        env:
          CRIME_DATA_DIR:   ${{ env.CRIME_DATA_DIR }}
          GEOID_LEN:        ${{ env.GEOID_LEN || '11' }}
          STACKING_DATASET: ${{ env.CRIME_DATA_DIR }}/fr_crime_09.csv
          ENABLE_SPATIAL_TE: "1"
          TE_ALPHA: "50"
          NEIGHBOR_FILE:    ${{ env.CRIME_DATA_DIR }}/neighbors.csv
          FAST_MODE:        ${{ env.FAST_MODE }}
          SKIP_CV:          ${{ env.SKIP_CV }}
          REUSE_MODELS:     "0"
          CV_JOBS:          "4"
          SUBSET_STRATEGY:  "last12m"
          SUBSET_MIN_POS:   "10000"
          BASE_MODELS:      ${{ env.BASE_MODELS }}
        run: |
          set -euo pipefail
          if [ -z "${NEIGHBOR_FILE:-}" ] || [ ! -f "${NEIGHBOR_FILE}" ]; then
            echo "ℹ️ NEIGHBOR_FILE yok → ENABLE_SPATIAL_TE=0"
            export ENABLE_SPATIAL_TE=0
            unset NEIGHBOR_FILE
          fi
          echo "🚀 TRAIN_PHASE=select"
          export TRAIN_PHASE=select
          python -u stacking_risk_pipeline_fr.py
          echo "🚀 TRAIN_PHASE=final"
          export TRAIN_PHASE=final
          python -u stacking_risk_pipeline_fr.py
          echo "✅ Stacking training done."

      # ─────────────────────────────────────────────────────────
      # FR 11 — RİSK ÇIKTILARI (hourly + daily)
      # ─────────────────────────────────────────────────────────
      - name: FR 11) Generate risk CSVs (hourly + daily)
        if: ${{ steps.gate.outputs.proceed == 'true' }}
        env:
          CRIME_DATA_DIR: ${{ env.CRIME_DATA_DIR }}
          WX_LOCATION:    "paris"
          WX_UNIT:        "metric"
        shell: bash
        run: |
          set -euo pipefail
          echo "▶ risk_exports_fr.py çalıştırılıyor..."
          if [ -f risk_exports_fr.py ]; then
            python -u risk_exports_fr.py
          elif [ -f scripts/risk_exports_fr.py ]; then
            python -u scripts/risk_exports_fr.py
          else
            echo "❌ risk_exports_fr.py bulunamadı"
            exit 1
          fi
          echo "📂 Üretilen risk dosyaları:"
          ls -lah "${CRIME_DATA_DIR}" | grep -E 'risk_(hourly|daily)_grid_full_labeled' || true

      - name: FR 12) Assert risk outputs exist
        if: ${{ steps.gate.outputs.proceed == 'true' }}
        shell: bash
        env:
          CRIME_DATA_DIR: ${{ env.CRIME_DATA_DIR }}
        run: |
          set -euo pipefail
          test -f "${CRIME_DATA_DIR}/risk_hourly_grid_full_labeled.csv"
          test -f "${CRIME_DATA_DIR}/risk_daily_grid_full_labeled.csv"
          echo "✅ risk CSV’leri mevcut."

      - name: FR 13) Build 2 ZIPs with EXACT files
        if: ${{ steps.gate.outputs.proceed == 'true' }}
        env:
          CRIME_DATA_DIR: ${{ env.CRIME_DATA_DIR }}
          ARTIFACT_DIR:   ${{ env.ARTIFACT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, sys, zipfile
          from pathlib import Path
          import pandas as pd
          
          base  = Path(os.environ.get("CRIME_DATA_DIR","crime_prediction_data")).expanduser().resolve()
          extra = Path(os.environ.get("ARTIFACT_DIR","artifact")).expanduser().resolve()
          base.mkdir(parents=True, exist_ok=True)
          extra.mkdir(parents=True, exist_ok=True)
          
          WANT = [
              "fr_crime_09.csv","fr_crime_09.parquet",
              "risk_hourly_grid_full_labeled.csv","risk_hourly_grid_full_labeled.parquet",
              "risk_daily_grid_full_labeled.csv","risk_daily_grid_full_labeled.parquet",
              "metrics_stacking.csv","metrics_stacking.parquet",
              "metrics_all.csv","metrics_all.parquet",
              "stacking_manifest.csv","stacking_manifest.parquet",
          ]
          
          def rglob_many(root: Path, pat: str):
              return [p for p in root.rglob(pat) if p.is_file()]
          
          def find_first(name: str):
              for root in (base, extra):
                  hits = rglob_many(root, name)
                  if hits:
                      return hits[0]
              return None
          
          sel = []
          for name in WANT:
              p = find_first(name)
              if p is None:
                  continue
              if "fr_crime_10" in p.name:
                  continue
              sel.append(p)
          
          # eksik olan eş dosyaları dönüştür
          pairs = [
              ("risk_hourly_grid_full_labeled.csv","risk_hourly_grid_full_labeled.parquet"),
              ("risk_daily_grid_full_labeled.csv","risk_daily_grid_full_labeled.parquet"),
              ("fr_crime_09.csv","fr_crime_09.parquet"),
              ("metrics_stacking.csv","metrics_stacking.parquet"),
              ("metrics_all.csv","metrics_all.parquet"),
          ]
          for csvn, pqn in pairs:
              csvp, pqp = find_first(csvn), find_first(pqn)
              if csvp and not pqp:
                  try:
                      df = pd.read_csv(csvp, low_memory=False)
                      pqp = csvp.with_suffix(".parquet")
                      df.to_parquet(pqp, index=False)
                      sel.append(pqp)
                  except Exception as e:
                      print(f"[WARN] parquet üretilemedi: {e}", file=sys.stderr)
              if pqp and not csvp:
                  try:
                      df = pd.read_parquet(pqp)
                      csvp = pqp.with_suffix(".csv")
                      df.to_csv(csvp, index=False)
                      sel.append(csvp)
                  except Exception as e:
                      print(f"[WARN] csv üretilemedi: {e}", file=sys.stderr)
          
          out_csv_zip = base / "fr_csv_outputs.zip"
          out_pq_zip  = base / "fr_parquet_outputs.zip"
          
          with zipfile.ZipFile(out_csv_zip, "w", compression=zipfile.ZIP_DEFLATED) as z:
              for p in sel:
                  if p.suffix.lower() == ".csv":
                      if str(p).startswith(str(base)):
                          arc = str(p.relative_to(base))
                      else:
                          arc = p.name
                      z.write(p, arcname=arc)
                      print(f"+ CSV: {p}")
          print(f"✅ CSV ZIP: {out_csv_zip}")
          
          with zipfile.ZipFile(out_pq_zip, "w", compression=zipfile.ZIP_DEFLATED) as z:
              for p in sel:
                  if p.suffix.lower() == ".parquet":
                      if str(p).startswith(str(base)):
                          arc = str(p.relative_to(base))
                      else:
                          arc = p.name
                      z.write(p, arcname=arc)
                      print(f"+ PQ: {p}")
          print(f"✅ Parquet ZIP: {out_pq_zip}")
          PY

      - name: Upload FR outputs (CSV ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: fr-crime-outputs-csv
          path: ${{ env.CRIME_DATA_DIR }}/fr_csv_outputs.zip
          overwrite: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload FR outputs (Parquet ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: fr-crime-outputs-parquet
          path: ${{ env.CRIME_DATA_DIR }}/fr_parquet_outputs.zip
          overwrite: true
          if-no-files-found: error
          retention-days: 14
