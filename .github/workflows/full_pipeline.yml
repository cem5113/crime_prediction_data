name: Full SF Crime Pipeline

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      persist:
        description: "Sonuçları nasıl saklayalım?"
        type: choice
        options: [artifact, commit, none]
        default: none
      force:
        description: "Manuel tetiklemede 07:00 kapısını YOK SAY"
        type: boolean
        default: true
      top_k: 
        description: "Stacking: her saat dilimi için önerilecek GEOID sayısı"
        default: "50"

permissions:
  actions: read
  contents: write

concurrency:
  group: full-pipeline-${{ github.ref }}
  cancel-in-progress: true
env:
  CRIME_DATA_DIR: ${{ github.workspace }}
  GEOID_LEN: "11"
  ACS_YEAR: ${{ vars.ACS_YEAR || 'LATEST' }}
  DEMOG_WHITELIST: ${{ vars.DEMOG_WHITELIST || '' }}
  CENSUS_GEO_LEVEL: ${{ vars.CENSUS_GEO_LEVEL || 'tract' }} 

  BACKFILL_DAYS: "0"
  SF_SODA_FETCH_STRATEGY: ${{ vars.SF_SODA_FETCH_STRATEGY || 'bulk' }}
  SF_SODA_PAGE_LIMIT: ${{ vars.SF_SODA_PAGE_LIMIT || '50000' }}
  SF_SODA_MAX_PAGES: ${{ vars.SF_SODA_MAX_PAGES || '100' }}

  SF911_API_URL: ${{ vars.SF911_API_URL || 'https://data.sfgov.org/resource/2zdj-bwza.json' }}
  SF911_AGENCY_FILTER: ${{ vars.SF911_AGENCY_FILTER || 'agency like "%Police%"' }}
  SF911_API_TOKEN: ${{ secrets.SF911_API_TOKEN }}
  SOCS_APP_TOKEN: ${{ secrets.SOCS_APP_TOKEN }}

  GDRIVE_FOLDER: "crime_inputs" 

  PATROL_TOP_K: ${{ github.event.inputs.top_k || '50' }}

  PATROL_HORIZON_DAYS: "1"
  WX_LOCATION: "san francisco"
  WX_UNIT: "us"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Ensure LFS objects
        run: |
          git lfs install
          git lfs pull
          echo "Repo root:"; ls -lah
          echo "crime_prediction_data:"; ls -lah crime_prediction_data || true
          echo "CRIME_DATA_DIR:"; ls -lah "${CRIME_DATA_DIR}" || true

      - name: Ensure data dir
        run: mkdir -p "${CRIME_DATA_DIR}"

      - name: Echo paths
        run: |
          pwd
          echo "CRIME_DATA_DIR=${CRIME_DATA_DIR}"
          ls -lah "${CRIME_DATA_DIR}" || true

      # --- SF 07:00 kapısı (TZ ayarla + saat kontrolü) ---
      - name: Set runner timezone to America/Los_Angeles
        uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: "America/Los_Angeles"

      - name: Gate by local SF time == 07 (bypassable)
        id: gate
        run: |
          set -euo pipefail
      
          now="$(date)"
          echo "Runner local time: $now"
          echo "RUN_LOCAL_TIME=$now" >> $GITHUB_ENV
      
          # schedule ise her zaman çalış
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "proceed=true" >> $GITHUB_OUTPUT
          else
            # Manuel + force=true ise geç
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force }}" = "true" ]; then
              echo "proceed=true" >> $GITHUB_OUTPUT
            else
              # Diğer durumda 07:00 kontrolü
              if [ "$(date +%H)" = "07" ]; then
                echo "proceed=true" >> $GITHUB_OUTPUT
              else
                echo "proceed=false" >> $GITHUB_OUTPUT
              fi
            fi
          fi

          DOW="$(date +%u)"  # 4 = Thursday
          echo "DOW=$DOW"
          if [ "$DOW" -eq 4 ]; then
            echo "is_thursday=1" >> $GITHUB_OUTPUT
          else
            echo "is_thursday=0" >> $GITHUB_OUTPUT
          fi

      - name: Skip summary (outside 07:00 and not forced)
        if: ${{ steps.gate.outputs.proceed != 'true' }}
        run: |
          {
            echo "## SF Crime Pipeline"
            echo ""
            echo "- Çalışma zamanı (SF): **$(date)**"
            echo "- Not: 07:00 kapısı nedeniyle adımlar atlandı. Manuel tetiklerken \`force=true\` verin."
          } >> $GITHUB_STEP_SUMMARY

      # ================== EK: ENV BOOTSTRAP (mevcut satırları değiştirmeden override) ==================
      - name: Bootstrap env overrides (BACKFILL & FRESHNESS)
        if: ${{ steps.gate.outputs.proceed == 'true' }}
        env:
          VARS_BACKFILL: ${{ vars.BACKFILL_DAYS }}           # org/repo → Settings → Variables → BACKFILL_DAYS
          VARS_FRESH_LAG: ${{ vars.FRESHNESS_SF_MAX_LAG_DAYS }}
        run: |
          set -euo pipefail
          # BACKFILL_DAYS öncelik: vars.BACKFILL_DAYS > mevcut env BACKFILL_DAYS > 30
          BF="${VARS_BACKFILL:-${BACKFILL_DAYS:-30}}"
          echo "BACKFILL_DAYS=${BF}" >> "$GITHUB_ENV"
          echo "Resolved BACKFILL_DAYS=${BF}"

          # FRESHNESS_SF_MAX_LAG_DAYS: vars > mevcut > 2
          FL="${VARS_FRESH_LAG:-${FRESHNESS_SF_MAX_LAG_DAYS:-2}}"
          echo "FRESHNESS_SF_MAX_LAG_DAYS=${FL}" >> "$GITHUB_ENV"
          echo "Resolved FRESHNESS_SF_MAX_LAG_DAYS=${FL}"
      # =================================================================================================

      - name: System deps for rtree (optional)
        if: ${{ steps.gate.outputs.proceed == 'true' }}
        run: sudo apt-get update && sudo apt-get install -y libspatialindex-dev

      - name: Set up Python 3.11
        if: ${{ steps.gate.outputs.proceed == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        if: ${{ steps.gate.outputs.proceed == 'true' }}
        run: |
          python -m pip install -U pip wheel setuptools
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install -U "geopandas==1.0.1" "shapely==2.0.4" "pyproj==3.6.1" "pyogrio==0.9.0" "rtree==1.3.0"
          pip install -U requests

      - name: 7-Day Forecast (Visual Crossing) → week.csv
        if: ${{ steps.gate.outputs.proceed == 'true' }}
        env:
          VISUAL_CROSSING_API_KEY: ${{ secrets.VISUAL_CROSSING_API_KEY }}
          WX_LOCATION: "San Francisco, CA"
          WX_UNIT: "us"
          CRIME_DATA_DIR: ${{ env.CRIME_DATA_DIR }}
        run: |
          set -e
          python -u scripts/update_week_forecast.py
          echo "week.csv — ilk 5 satır:"
          head -n 5 "${CRIME_DATA_DIR}/week.csv" || true


      - name: Geo stack smoke test
        if: ${{ steps.gate.outputs.proceed == 'true' }}
        run: |
          python - <<'PY'
          import geopandas, shapely, pyproj, pyogrio, pandas
          print("geopandas", geopandas.__version__)
          print("shapely", shapely.__version__)
          print("pyproj", pyproj.__version__)
          print("pyogrio", pyogrio.__version__)
          print("pandas", pandas.__version__)
          PY

      - name: Week → parquet cache
        if: ${{ steps.gate.outputs.proceed == 'true' }}
        env:
          CRIME_DATA_DIR: ${{ env.CRIME_DATA_DIR }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pandas as pd
          D = os.environ["CRIME_DATA_DIR"]
          csvp = os.path.join(D, "week.csv")
          parp = os.path.join(D, "week.parquet")
          df = pd.read_csv(csvp)
          df.to_parquet(parp, index=False, engine="pyarrow")
          print("✅ wrote", parp, "shape=", df.shape)
          PY
          ls -lh "${CRIME_DATA_DIR}/week.csv" "${CRIME_DATA_DIR}/week.parquet" || true

      # >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>>
      # Prefetch sf_crime_y.csv (GH_TOKEN set → login YOK)
      - name: 00) Prefetch sf_crime_y.csv from previous successful run (artifact)
        if: ${{ steps.gate.outputs.proceed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }} # gh CLI bunu otomatik kullanır; login YOK
          ARTIFACT_NAME: sf-crime-pipeline-output
          WORKFLOW_NAME: Full SF Crime Pipeline
          TARGET_FILE: sf_crime_y.csv
          OUT_DIR: crime_prediction_data
        run: |
          set -euo pipefail

          mkdir -p "${OUT_DIR}"
          if [ -f "${OUT_DIR}/${TARGET_FILE}" ]; then
            echo "ℹ️ ${OUT_DIR}/${TARGET_FILE} zaten var, indirme atlandı."
            exit 0
          fi

          sudo apt-get update -y >/dev/null
          sudo apt-get install -y unzip >/dev/null

          if ! command -v gh >/dev/null; then
            type -p curl >/dev/null && sudo curl -sSL https://raw.githubusercontent.com/cli/cli/trunk/script/install.sh | sh
          fi
          gh --version || true
          gh auth status || true

          mkdir -p _prev
          FOUND=""

          # Son 10 başarılı run içinde ara; ilk bulduğunu kopyala
          RUNS=$(gh run list -R "${GITHUB_REPOSITORY}" \
                  --workflow "${WORKFLOW_NAME}" --status success \
                  -L 10 --json databaseId -q '.[].databaseId' || true)

          if [ -z "${RUNS}" ]; then
            echo "ℹ️ Başarılı geçmiş run bulunamadı; release fallback devreye girecek."
            exit 0
          fi

          for RID in ${RUNS}; do
            echo "🔎 Run #$RID içinde ${TARGET_FILE} aranıyor…"
            rm -rf "_prev/$RID" && mkdir -p "_prev/$RID"
            if gh run download -R "${GITHUB_REPOSITORY}" "$RID" \
                 -n "${ARTIFACT_NAME}" -D "_prev/$RID" >/dev/null 2>&1; then
              F=$(find "_prev/$RID" -type f -iname "${TARGET_FILE}" | head -n1 || true)
              if [ -n "${F:-}" ]; then
                cp -f "$F" "${OUT_DIR}/${TARGET_FILE}"
                echo "✅ Bulundu ve kopyalandı: $F → ${OUT_DIR}/${TARGET_FILE}"
                FOUND="yes"
                break
              fi
            else
              echo "  ↪️ Artifact indirilemedi veya yok (#$RID)."
            fi
          done

          if [ -z "${FOUND}" ]; then
            echo "ℹ️ ${TARGET_FILE} önceki artifact’larda bulunamadı; update_crime.py release fallback kullanacak."
          fi
      # <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<

      # ---- PIPELINE ----
      - name: 01) Suç tabanı ve grid → sf_crime.csv + gridler
        if: ${{ steps.gate.outputs.proceed == 'true' }}
        run: |
          set -e
          python -u update_crime.py

      - name: 02) 911 → sf_crime_01.csv
        if: ${{ steps.gate.outputs.proceed == 'true' }}
        run: |
          set -e
          if [ -f update_911.py ]; then
            python -u update_911.py
          else
            python -u scripts/update_911.py
          fi

      - name: 02.fix) Move & normalize 911 CSVs into CRIME_DATA_DIR
        if: ${{ steps.gate.outputs.proceed == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p "${CRIME_DATA_DIR}"

          # 1) Olası kaynak konumlarından kopyala
          CANDS=(
            "sf_911_last_5_year.csv" "sf_911_last_5_year_y.csv"
            "sf_911_last_5_year.csv.gz" "sf_911_last_5_year_y.csv.gz"
            "_tmp_911.csv" "sf_911_recent.csv"  #  ← görülen isimler
            "${CRIME_DATA_DIR}/sf_911_last_5_year.csv"
            "${CRIME_DATA_DIR}/sf_911_last_5_year_y.csv"
            "data/sf_911_last_5_year.csv" "data/sf_911_last_5_year_y.csv"
            "data/_tmp_911.csv" "data/sf_911_recent.csv"
            "outputs/sf_911_last_5_year.csv" "outputs/sf_911_last_5_year_y.csv"
            "outputs/_tmp_911.csv" "outputs/sf_911_recent.csv"
          )
          for p in "${CANDS[@]}"; do
            if [ -f "$p" ]; then
              base="$(basename "$p")"
              if [ -e "${CRIME_DATA_DIR}/${base}" ] && [ "$p" -ef "${CRIME_DATA_DIR}/${base}" ]; then
                echo "skip (same file): $p"
                continue
              fi
              cp -f "$p" "${CRIME_DATA_DIR}/"
              echo "✅ 911 kopyalandı: $p → ${CRIME_DATA_DIR}/${base}"
            fi
          done

          # 2) İsim normalize: _tmp_911.csv veya sf_911_recent.csv → sf_911_last_5_year.csv
          if [ ! -f "${CRIME_DATA_DIR}/sf_911_last_5_year.csv" ]; then
            if [ -f "${CRIME_DATA_DIR}/_tmp_911.csv" ]; then
              mv -f "${CRIME_DATA_DIR}/_tmp_911.csv" "${CRIME_DATA_DIR}/sf_911_last_5_year.csv"
              echo "🔧 rename: _tmp_911.csv → sf_911_last_5_year.csv"
            elif [ -f "${CRIME_DATA_DIR}/sf_911_recent.csv" ]; then
              cp -f "${CRIME_DATA_DIR}/sf_911_recent.csv" "${CRIME_DATA_DIR}/sf_911_last_5_year.csv"
              echo "🔧 copy: sf_911_recent.csv → sf_911_last_5_year.csv"
            fi
          fi

          # 3) Head’ler
          echo "---- 911 heads ----"
          head -n 3 "${CRIME_DATA_DIR}/sf_911_last_5_year.csv" || true
          head -n 3 "${CRIME_DATA_DIR}/sf_911_last_5_year_y.csv" || true

      - name: 03) 311 → sf_crime_02.csv
        if: ${{ steps.gate.outputs.proceed == 'true' }}
        run: |
          set -e
          if [ -f update_311.py ]; then
            python -u update_311.py
          else
            python -u scripts/update_311.py
          fi

      - name: 03.fix) Move & normalize 311 CSVs into CRIME_DATA_DIR
        if: ${{ steps.gate.outputs.proceed == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p "${CRIME_DATA_DIR}"

          # 1) Olası kaynak konumlarından kopyala (tekil/çoğul tüm varyantlar)
          CANDS=(
            "sf_311_last_5_years.csv"      "sf_311_last_5_years_y.csv"
            "sf_311_last_5_year.csv"       "sf_311_last_5_year_y.csv"   # ← listede tekil var
            "sf_311_last_5_years.csv.gz"   "sf_311_last_5_years_y.csv.gz"
            "sf_311_last_5_year.csv.gz"    "sf_311_last_5_year_y.csv.gz"
            "${CRIME_DATA_DIR}/sf_311_last_5_years.csv"    "${CRIME_DATA_DIR}/sf_311_last_5_years_y.csv"
            "${CRIME_DATA_DIR}/sf_311_last_5_year.csv"     "${CRIME_DATA_DIR}/sf_311_last_5_year_y.csv"
            "data/sf_311_last_5_years.csv" "data/sf_311_last_5_years_y.csv"
            "data/sf_311_last_5_year.csv"  "data/sf_311_last_5_year_y.csv"
            "outputs/sf_311_last_5_years.csv" "outputs/sf_311_last_5_years_y.csv"
            "outputs/sf_311_last_5_year.csv"  "outputs/sf_311_last_5_year_y.csv"
          )
          for p in "${CANDS[@]}"; do
            if [ -f "$p" ]; then
              base="$(basename "$p")"
              if [ -e "${CRIME_DATA_DIR}/${base}" ] && [ "$p" -ef "${CRIME_DATA_DIR}/${base}" ]; then
                echo "skip (same file): $p"
                continue
              fi
              cp -f "$p" "${CRIME_DATA_DIR}/"
              echo "✅ 311 kopyalandı: $p → ${CRIME_DATA_DIR}/${base}"
            fi
          done

          # 2) İsim normalize: tekil → çoğul
          if [ ! -f "${CRIME_DATA_DIR}/sf_311_last_5_years.csv" ] && [ -f "${CRIME_DATA_DIR}/sf_311_last_5_year.csv" ]; then
            cp -f "${CRIME_DATA_DIR}/sf_311_last_5_year.csv" "${CRIME_DATA_DIR}/sf_311_last_5_years.csv"
            echo "🔧 copy: sf_311_last_5_year.csv → sf_311_last_5_years.csv"
          fi
          if [ ! -f "${CRIME_DATA_DIR}/sf_311_last_5_years_y.csv" ] && [ -f "${CRIME_DATA_DIR}/sf_311_last_5_year_y.csv" ]; then
            cp -f "${CRIME_DATA_DIR}/sf_311_last_5_year_y.csv" "${CRIME_DATA_DIR}/sf_311_last_5_years_y.csv"
            echo "🔧 copy: sf_311_last_5_year_y.csv → sf_311_last_5_years_y.csv"
          fi

          # 3) Head’ler
          echo "---- 311 heads ----"
          head -n 3 "${CRIME_DATA_DIR}/sf_311_last_5_years.csv" || true
          head -n 3 "${CRIME_DATA_DIR}/sf_311_last_5_years_y.csv" || true
          
      - name: 04) Nüfus → sf_crime_03.csv (demografi + nüfus)
        if: ${{ steps.gate.outputs.proceed == 'true' }}
        env:
          POPULATION_PATH: ${{ env.CRIME_DATA_DIR }}/sf_population.csv
          CENSUS_GEO_LEVEL: ${{ env.CENSUS_GEO_LEVEL }}  # global env'de "tract"
          ACS_YEAR: ${{ env.ACS_YEAR }}
          DEMOG_WHITELIST: ${{ env.DEMOG_WHITELIST }}
        run: |
          set -e
          echo "---- update_population.py (ilk 30 satır) ----"
          sed -n '1,30p' update_population.py || true
          python -u update_population.py

      - name: 05) Otobüs → sf_crime_04.csv
        if: ${{ steps.gate.outputs.proceed == 'true' }}
        env:
          CRIME_DATA_DIR: ${{ env.CRIME_DATA_DIR }}
          FORCE_BUS_REFRESH: ${{ steps.gate.outputs.is_thursday }}
        run: |
          set -euo pipefail
          echo "🚌 BUS STEP"
          echo "CRIME_DATA_DIR=${CRIME_DATA_DIR}"
          echo "FORCE_BUS_REFRESH=${FORCE_BUS_REFRESH}"
          ls -lah "${CRIME_DATA_DIR}" || true
      
          python -u update_bus.py

      - name: 06) Tren (BART) → sf_crime_05.csv
        if: ${{ steps.gate.outputs.proceed == 'true' }}
        env:
          CRIME_DATA_DIR: ${{ env.CRIME_DATA_DIR }}
        run: |
          set -euo pipefail
          echo "CWD=$(pwd)"
          echo "CRIME_DATA_DIR=${CRIME_DATA_DIR}"
          ls -lah "${CRIME_DATA_DIR}" || true
          ls -lah "${CRIME_DATA_DIR}/sf_crime_04.csv" || { echo "❌ sf_crime_04.csv yok"; exit 2; }
      
          # Perşembe: refresh=1, diğer günler: cache=0
          DOW=$(TZ=America/Los_Angeles date +%u)  # 1=Mon ... 4=Thu ... 7=Sun
          if [ "$DOW" = "4" ]; then
            export FORCE_TRAIN_REFRESH=1
            echo "🟢 Thursday → FORCE_TRAIN_REFRESH=1"
          else
            export FORCE_TRAIN_REFRESH=0
            echo "🟡 Not Thursday → FORCE_TRAIN_REFRESH=0 (cache mode)"
          fi
      
          python -u update_train.py
      
      - name: POI enrich (GEOID-only)
        if: ${{ steps.gate.outputs.proceed == 'true' }}
        env:
          CRIME_DATA_DIR: ${{ env.CRIME_DATA_DIR }}
          CRIME_IN:  "${{ env.CRIME_DATA_DIR }}/sf_crime_05.csv"
          CRIME_OUT: "${{ env.CRIME_DATA_DIR }}/sf_crime_06.csv"
        run: |
          set -euo pipefail
          echo "CWD=$(pwd)"
          echo "CRIME_DATA_DIR=${CRIME_DATA_DIR}"
          ls -lah "${CRIME_DATA_DIR}" || true
          ls -lah "${CRIME_DATA_DIR}/sf_crime_05.csv" || { echo "❌ sf_crime_05.csv yok"; exit 2; }
      
          # Perşembe: refresh=1, diğer günler: cache=0
          DOW=$(TZ=America/Los_Angeles date +%u)
          if [ "$DOW" = "4" ]; then
            export FORCE_POI_REFRESH=1
            echo "🟢 Thursday → FORCE_POI_REFRESH=1"
          else
            export FORCE_POI_REFRESH=0
            echo "🟡 Not Thursday → FORCE_POI_REFRESH=0 (cache mode)"
          fi
      
          python -u update_poi.py
      
          # ============================================================
          # Weekly POI refresh — THURSDAY
          # (UTC: 4 = Thursday)
          # ============================================================
          DOW_UTC="$(date -u +%u)"   # 1=Mon ... 7=Sun
      
          if [ "${DOW_UTC}" = "4" ]; then
            echo "♻️ Weekly POI refresh (Thursday) => FORCE_POI_REFRESH=1"
            export FORCE_POI_REFRESH=1
          else
            export FORCE_POI_REFRESH=0
          fi
      
          echo "FORCE_POI_REFRESH=${FORCE_POI_REFRESH}"
      
          if [ -f update_poi.py ]; then
            python -u update_poi.py
          elif [ -f pipeline_make_sf_crime_06.py ]; then
            python -u pipeline_make_sf_crime_06.py
          else
            echo "POI adımı bulunamadı"; exit 2
          fi

      - name: 07.9) Assert sf_crime_06 presence (before police/gov)
        if: ${{ steps.gate.outputs.proceed == 'true' }}
        run: |
          set -euo pipefail
          D="${CRIME_DATA_DIR}"
          F="${D}/sf_crime_06.csv"
          echo "→ Beklenen: $F"
          ls -lah "$D" | sed -n '1,120p' || true
          [ -f "$F" ] || { echo "❌ sf_crime_06.csv yok! POI adımının DAILY_OUT/CRIME_OUT loglarını kontrol et."; exit 2; }
          echo "---- sf_crime_06.csv (head) ----"
          head -n 5 "$F" || true

      - name: 08) Polis & Devlet binaları → sf_crime_07.csv
        if: ${{ steps.gate.outputs.proceed == 'true' }}
        env:
          CRIME_DATA_DIR: ${{ env.CRIME_DATA_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          echo "🏛️ POLICE/GOV STEP"
          echo "CWD=$(pwd)"
          echo "CRIME_DATA_DIR=${CRIME_DATA_DIR}"
          ls -lah "${CRIME_DATA_DIR}" | sed -n '1,160p' || true
      
          # input kontrol
          ls -lah "${CRIME_DATA_DIR}/sf_crime_06.csv" || { echo "❌ sf_crime_06.csv yok"; exit 2; }
      
          # Perşembe: refresh=1, diğer günler: cache=0  (SF timezone)
          DOW=$(TZ=America/Los_Angeles date +%u)  # 1=Mon ... 4=Thu ... 7=Sun
          if [ "$DOW" = "4" ]; then
            export FORCE_PG_REFRESH=1
            echo "🟢 Thursday → FORCE_PG_REFRESH=1"
          else
            export FORCE_PG_REFRESH=0
            echo "🟡 Not Thursday → FORCE_PG_REFRESH=0 (cache mode)"
          fi
      
          # script seç ve çalıştır
          if [ -f update_police_gov.py ]; then
            python -u update_police_gov.py
          elif [ -f scripts/enrich_police_gov_06_to_07.py ]; then
            python -u scripts/enrich_police_gov_06_to_07.py
          else
            echo "❌ Polis/Gov adımı bulunamadı"; exit 2
          fi
      
          # output kontrol
          ls -lah "${CRIME_DATA_DIR}/sf_crime_07.csv" || { echo "❌ sf_crime_07.csv oluşmadı"; exit 3; }
          echo "sf_crime_07.csv (head):"
          head -n 5 "${CRIME_DATA_DIR}/sf_crime_07.csv" || true

      - name: 09) Hava durumu — sadece update
        if: ${{ steps.gate.outputs.proceed == 'true' }}
        run: |
          set -e
          if [ -f update_weather.py ]; then
            python -u update_weather.py
          elif [ -f scripts/update_weather.py ]; then
            python -u scripts/update_weather.py
          else
            echo "❌ Weather script not found"; exit 2
          fi
          echo "sf_weather_5years.csv — ilk 5 satır:"
          head -n 5 "${CRIME_DATA_DIR}/sf_weather_5years.csv" || head -n 5 sf_weather_5years.csv || true

      - name: Weather → parquet cache
        if: ${{ steps.gate.outputs.proceed == 'true' }}
        env:
          CRIME_DATA_DIR: ${{ env.CRIME_DATA_DIR }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pandas as pd
          D = os.environ["CRIME_DATA_DIR"]
          csvp = os.path.join(D, "sf_weather_5years.csv")
          parp = os.path.join(D, "sf_weather_5years.parquet")
          df = pd.read_csv(csvp)
          df.to_parquet(parp, index=False, engine="pyarrow")
          print("✅ wrote", parp, "shape=", df.shape)
          PY
          ls -lh "${CRIME_DATA_DIR}/sf_weather_5years.csv" "${CRIME_DATA_DIR}/sf_weather_5years.parquet" || true

      - name: Normalize grid outputs (put under CRIME_DATA_DIR)
        if: ${{ steps.gate.outputs.proceed == 'true' }}
        run: |
          set -euo pipefail
          mkdir -p "${CRIME_DATA_DIR}"
          DST="${CRIME_DATA_DIR}/sf_crime_grid_full_labeled.csv"
          CANDIDATES=(
            "sf_crime_grid_full_labeled.csv"
            "data/sf_crime_grid_full_labeled.csv"
            "outputs/sf_crime_grid_full_labeled.csv"
            # "${CRIME_DATA_DIR}/sf_crime_grid_full_labeled.csv"  # ← KALDIRILDI
          )
          FOUND=""
          for p in "${CANDIDATES[@]}"; do
            if [ -f "$p" ]; then
              # Eğer zaten aynı dosyaysa kopyalama
              if [ -e "$DST" ] && [ "$p" -ef "$DST" ]; then
                echo "ℹ️ Grid zaten doğru yerde: $DST"
                FOUND="yes"
                break
              fi
              cp -f "$p" "$DST"
              echo "✅ Grid kopyalandı: $p → $DST"
              FOUND="yes"
              break
            fi
          done
          if [ -z "${FOUND}" ]; then
            echo "⚠️ sf_crime_grid_full_labeled.csv bulunamadı; stacking bazı görünümleri atlayabilir."
          fi

      - name: 10.5) neighbors.csv (kullan/normalize/üret + kalite kontrol)
        if: ${{ steps.gate.outputs.proceed == 'true' }}
        env:
          CRIME_DATA_DIR: ${{ env.CRIME_DATA_DIR }}
          STACKING_DATASET: ${{ env.CRIME_DATA_DIR }}/sf_crime_grid_full_labeled.csv
          NEIGHBOR_FILE: ${{ env.CRIME_DATA_DIR }}/neighbors.csv
          NEIGHBOR_STRATEGY: queen         # queen|rook
          MIN_NEIGHBOR_DEG: "3"            # en az derece
          KNN_K: "5"                       # takviye için k
          NEIGHBOR_POLY: ${{ env.CRIME_DATA_DIR }}/sf_grid.geojson
        run: |
          set -euo pipefail
          DEST="${CRIME_DATA_DIR}/neighbors.csv"
          mkdir -p "${CRIME_DATA_DIR}"

          echo "→ hedef: $DEST"
          # 1) Varsa repodan kopyala
          for p in \
            "${CRIME_DATA_DIR}/neighbors.csv" \
            "crime_prediction_data/neighbors.csv" \
            "neighbors.csv" "data/neighbors.csv" "inputs/neighbors.csv"
          do
            if [ -f "$p" ]; then
              if [ -e "$DEST" ] && [ "$p" -ef "$DEST" ]; then
                echo "ℹ️ Zaten hedefte: $DEST"
              else
                cp -f "$p" "$DEST"
                echo "✅ Copied: $p → $DEST"
              fi
              break
            fi
          done

          # 2) Başlıkları normalize et → geoid,neighbor
          python - <<'PY'
          import os, pandas as pd, sys, re
          p = os.path.join(os.environ["CRIME_DATA_DIR"], "neighbors.csv")
          try:
              df = pd.read_csv(p, dtype=str)
          except Exception:
              sys.exit(0)
          if df.empty:
              sys.exit(0)
          low = {c.lower(): c for c in df.columns}
          src = low.get("geoid") or low.get("src") or low.get("source")
          dst = (low.get("neighbor") or low.get("neighbor_geoid") or
                 low.get("neighborgeoid") or low.get("dst") or low.get("target"))
          if not src or not dst:
              print("⚠️ neighbors.csv başlıkları tanınmadı:", df.columns.tolist()); sys.exit(0)
          df = df.rename(columns={src: "geoid", dst: "neighbor"})
          L = int(os.environ.get("GEOID_LEN","11"))
          for c in ("geoid","neighbor"):
              df[c] = df[c].astype(str).str.extract(r"(\d+)", expand=False).str.zfill(L)
          # çift yönlü ve tekille
          df = pd.concat([df, df.rename(columns={"geoid":"neighbor","neighbor":"geoid"})], ignore_index=True)
          df = df.dropna().drop_duplicates()
          df = df[df["geoid"] != df["neighbor"]]
          df[["geoid","neighbor"]].to_csv(p, index=False)
          print("Neighbors headers →", ["geoid","neighbor"], f"(rows={len(df)})")
          PY

          # 3) Kalite kontrol
          python - <<'PY'
          import os, pandas as pd, sys, json, pathlib
          from pathlib import Path
          p = Path(os.environ["CRIME_DATA_DIR"]) / "neighbors.csv"
          min_deg = int(os.environ.get("MIN_NEIGHBOR_DEG","3"))
          if not p.exists() or p.stat().st_size == 0:
              need=True; reason="yok/boş"
          else:
              try:
                  df = pd.read_csv(p, dtype=str)
                  ok = set(df.columns) >= {"geoid","neighbor"} and len(df)>0
                  mindeg = (df.groupby("geoid")["neighbor"].nunique().min() if ok else 0)
                  need = (not ok) or (mindeg is None) or (mindeg < min_deg)
                  reason = f"min_deg={mindeg}<{min_deg}" if ok else "geçersiz başlık/boş"
              except Exception as e:
                  need=True; reason=f"hata:{e}"
          if need:
              Path(os.environ["CRIME_DATA_DIR"]).joinpath(".rebuild_neighbors").write_text(reason)
              print("REBUILD=1 →", reason)
          else:
              print("REBUILD=0 → yeterli kalite")
          PY

          # 4) Yeniden üretim gerekiyorsa
          if [ -f "${CRIME_DATA_DIR}/.rebuild_neighbors" ]; then
            if [ ! -f "${NEIGHBOR_POLY}" ]; then
              echo "⚠️ Polygon katmanı yok: ${NEIGHBOR_POLY}. Mevcut neighbors.csv kullanılacak."
            else
              echo "🔧 Komşuluk yeniden oluşturuluyor (${NEIGHBOR_STRATEGY}, min_deg=${MIN_NEIGHBOR_DEG}, knn_k=${KNN_K})"

              cat > _rebuild_neighbors.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations
          import os, re
          from pathlib import Path
          import pandas as pd

          try:
              import geopandas as gpd
          except Exception:
              gpd = None

          CRIME_DIR  = Path(os.environ.get("CRIME_DATA_DIR","crime_prediction_data"))
          GEOID_LEN  = int(os.environ.get("GEOID_LEN","11"))
          STRATEGY   = os.environ.get("NEIGHBOR_STRATEGY","queen").lower()
          MIN_DEG    = int(os.environ.get("MIN_NEIGHBOR_DEG","3"))
          KNN_K      = int(os.environ.get("KNN_K","5"))
          OUT_PATH   = Path(os.environ.get("NEIGHBOR_FILE", str(CRIME_DIR/"neighbors.csv")))
          GRID_CSV   = Path(os.environ.get("STACKING_DATASET", str(CRIME_DIR/"sf_crime_grid_full_labeled.csv")))
          POLY_HINT  = os.environ.get("NEIGHBOR_POLY","")

          def _norm(s: pd.Series) -> pd.Series:
              return s.astype(str).str.extract(r"(\d+)", expand=False).str.zfill(GEOID_LEN)
          def _sym(df: pd.DataFrame) -> pd.DataFrame:
              rev = df.rename(columns={"geoid":"neighbor","neighbor":"geoid"})
              out = pd.concat([df, rev], ignore_index=True)
              out = out[out["geoid"] != out["neighbor"]]
              return out.drop_duplicates()
          def _neighbors_from_polygons(path: str) -> pd.DataFrame | None:
              if not gpd:
                  return None
              try:
                  gdf = gpd.read_file(path)
              except Exception:
                  return None
              low = {re.sub(r"[^a-z0-9]","", c.lower()): c for c in gdf.columns}
              gcol = low.get("geoid") or low.get("geoid10") or low.get("geographyid") or list(gdf.columns)[0]
              if "geometry" not in gdf.columns:
                  return None
              gdf = gdf[[gcol,"geometry"]].rename(columns={gcol:"geoid"}).copy()
              gdf["geoid"] = _norm(gdf["geoid"])
              gdf = gdf[gdf["geometry"].notna()].reset_index(drop=True)
              pairs = gdf.sindex.query_bulk(gdf.geometry, predicate="touches")
              i, j = pairs
              m = pd.DataFrame({"i": i, "j": j})
              m = m[m["i"] < m["j"]]
              df = pd.DataFrame({
                  "geoid":    gdf.loc[m["i"], "geoid"].to_numpy(),
                  "neighbor": gdf.loc[m["j"], "geoid"].to_numpy(),
              })
              return _sym(df.drop_duplicates())
          def _centroids_table(poly_ok: bool) -> pd.DataFrame | None:
              if poly_ok and gpd:
                  gdf = gpd.read_file(POLY_HINT)
                  low = {re.sub(r"[^a-z0-9]","", c.lower()): c for c in gdf.columns}
                  gcol = low.get("geoid") or low.get("geoid10") or low.get("geographyid") or list(gdf.columns)[0]
                  c = gdf[[gcol,"geometry"]].rename(columns={gcol:"geoid"}).copy()
                  c["geoid"] = _norm(c["geoid"])
                  cent = c.geometry.centroid
                  return pd.DataFrame({"geoid": c["geoid"], "x": cent.x, "y": cent.y})
              if GRID_CSV.exists():
                  df = pd.read_csv(GRID_CSV, dtype=str, low_memory=False)
                  low = {re.sub(r"[^a-z0-9]","", c.lower()): c for c in df.columns}
                  gcol = low.get("geoid") or low.get("geoid10") or low.get("geographyid")
                  lat  = low.get("lat") or low.get("latitude") or low.get("centroidlat")
                  lon  = low.get("lon") or low.get("lng") or low.get("longitude") or low.get("centroidlon")
                  if gcol and lat and lon:
                      t = df[[gcol, lat, lon]].rename(columns={gcol:"geoid", lat:"y", lon:"x"}).copy()
                      t["geoid"] = _norm(t["geoid"])
                      t["x"] = pd.to_numeric(t["x"], errors="coerce")
                      t["y"] = pd.to_numeric(t["y"], errors="coerce")
                      return t.dropna()
              return None
          def _ensure_min_degree(nb: pd.DataFrame, geos: pd.DataFrame) -> pd.DataFrame:
              import numpy as np
              if geos is None or geos.empty:
                  return nb
              deg = nb.groupby("geoid")["neighbor"].nunique()
              need = set(deg.index[deg < MIN_DEG] if not deg.empty else geos["geoid"])
              if not need:
                  return nb
              idx = {g:i for i,g in enumerate(geos["geoid"])}
              XY  = geos[["x","y"]].to_numpy()
              add = []
              for g in need:
                  i = idx[g]
                  d = np.sum((XY - XY[i])**2, axis=1)
                  order = np.argsort(d)
                  picks = []
                  for j in order:
                      gj = geos.iloc[j]["geoid"]
                      if gj == g:
                          continue
                      picks.append(gj)
                      if len(picks) >= KNN_K:
                          break
                  add += [(g, n) for n in picks]
              nb2 = pd.concat([nb, pd.DataFrame(add, columns=["geoid","neighbor"])], ignore_index=True)
              return _sym(nb2.drop_duplicates())
          def main():
              poly_ok = bool(POLY_HINT) and Path(POLY_HINT).exists()
              nb = _neighbors_from_polygons(POLY_HINT) if poly_ok else pd.DataFrame(columns=["geoid","neighbor"])
              cent = _centroids_table(poly_ok)
              nb = _ensure_min_degree(nb, cent)
              if nb.empty:
                  nb = pd.DataFrame(columns=["geoid","neighbor"])
              nb["geoid"] = _norm(nb["geoid"])
              nb["neighbor"] = _norm(nb["neighbor"])
              nb = _sym(nb).drop_duplicates().sort_values(["geoid","neighbor"])
              OUT_PATH.parent.mkdir(parents=True, exist_ok=True)
              nb.to_csv(OUT_PATH, index=False)
              deg = nb.groupby("geoid")["neighbor"].nunique()
              print(f"neighbors.csv yazıldı → {OUT_PATH} | n_edges={len(nb)} | n_nodes={len(deg)} | min_deg={int(deg.min()) if len(deg) else 0} | mean_deg={round(float(deg.mean()),2) if len(deg) else 0.0}")
          if __name__ == "__main__":
              main()
          PY
              python _rebuild_neighbors.py
              rm -f _rebuild_neighbors.py
              rm -f "${CRIME_DATA_DIR}/.rebuild_neighbors"
            fi
          fi

          echo "neighbors.csv (ilk 10 satır):"
          head -n 10 "${DEST}" || true

      - name: FR 09) Neighbors
        if: ${{ steps.gate.outputs.proceed == 'true' }}
        env:
          CRIME_DATA_DIR: ${{ env.CRIME_DATA_DIR }}
        shell: bash
        run: |
          set -euo pipefail
      
          # script seç (ÖNCE)
          if [ -f scripts/make_neighbors.py ]; then
            PY="scripts/make_neighbors.py"
          elif [ -f make_neighbors.py ]; then
            PY="make_neighbors.py"
          else
            echo "⚠️ make_neighbors.py bulunamadı, adım atlanıyor."
            exit 0
          fi
      
          echo "✅ Using PY=$PY"
          ls -lah "$PY" || true
      
          # input kontrol
          [ -f "${CRIME_DATA_DIR}/sf_crime_08.csv" ] || { echo "❌ sf_crime_08.csv yok"; exit 2; }
      
          # çalıştır
          python -u "$PY"
      
          # output kontrol
          [ -f "${CRIME_DATA_DIR}/sf_crime_09.csv" ] || { echo "❌ sf_crime_09.csv oluşmadı"; exit 3; }
      
          echo "✅ Neighbors çıktı: ${CRIME_DATA_DIR}/sf_crime_09.csv"
          head -n 5 "${CRIME_DATA_DIR}/sf_crime_09.csv" || true

      - name: sf_crime_09.csv → parquet
        if: ${{ steps.gate.outputs.proceed == 'true' }}
        env:
          CRIME_DATA_DIR: ${{ env.CRIME_DATA_DIR }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pandas as pd
          D = os.environ["CRIME_DATA_DIR"]
          csvp = os.path.join(D, "sf_crime_09.csv")
          parp = os.path.join(D, "sf_crime_09.parquet")

          df = pd.read_csv(csvp, low_memory=False)

          # GEOID kritikse stringe sabitle (opsiyonel ama öneririm)
          if "GEOID" in df.columns:
              df["GEOID"] = (
                  df["GEOID"].astype(str)
                    .str.replace(r"\D", "", regex=True)
                    .str.zfill(11)
              )

          df.to_parquet(parp, index=False, engine="pyarrow")
          print("✅ wrote", parp, "shape=", df.shape)
          PY
          ls -lh "${CRIME_DATA_DIR}/sf_crime_09.csv" "${CRIME_DATA_DIR}/sf_crime_09.parquet" || true

      - name: 10.9) Quick verify (after neighbors)
        if: ${{ steps.gate.outputs.proceed == 'true' }}
        run: |
          set -euo pipefail
          echo "=== AFTER NEIGHBORS: files in CRIME_DATA_DIR ==="
          ls -lah "${CRIME_DATA_DIR}" | sed -n '1,200p' || true

          for f in \
            sf_crime.csv \
            sf_crime_y.csv \
            sf_crime_01.csv sf_crime_02.csv sf_crime_03.csv sf_crime_04.csv sf_crime_05.csv sf_crime_06.csv sf_crime_07.csv sf_crime_08.csv sf_crime_09.csv \
            sf_911_last_5_year.csv sf_311_last_5_years.csv \
            sf_crime_grid_full_labeled.csv \
            neighbors.csv
          do
            p="${CRIME_DATA_DIR}/$f"
            if [ -f "$p" ]; then
              echo "✅ $f"
              head -n 3 "$p" || true
            else
              echo "⚠️ missing: $f"
            fi
          done

      - name: Upload artifact (datasets only, after neighbors)
        if: ${{ steps.gate.outputs.proceed == 'true' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.persist == 'artifact')) }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: sf-crime-pipeline-output
          if-no-files-found: warn
          retention-days: 3
          path: |
            ${{ env.CRIME_DATA_DIR }}/sf_crime.csv
            ${{ env.CRIME_DATA_DIR }}/sf_crime_y.csv
            ${{ env.CRIME_DATA_DIR }}/sf_population.csv
            ${{ env.CRIME_DATA_DIR }}/sf_crime_01.csv
            ${{ env.CRIME_DATA_DIR }}/sf_crime_02.csv
            ${{ env.CRIME_DATA_DIR }}/sf_crime_03.csv
            ${{ env.CRIME_DATA_DIR }}/sf_crime_04.csv
            ${{ env.CRIME_DATA_DIR }}/sf_crime_05.csv
            ${{ env.CRIME_DATA_DIR }}/sf_crime_06.csv
            ${{ env.CRIME_DATA_DIR }}/sf_crime_07.csv
            ${{ env.CRIME_DATA_DIR }}/sf_crime_08.csv
            ${{ env.CRIME_DATA_DIR }}/sf_crime_09.csv
            ${{ env.CRIME_DATA_DIR }}/sf_crime_grid_full_labeled.csv
            ${{ env.CRIME_DATA_DIR }}/neighbors.csv
            ${{ env.CRIME_DATA_DIR }}/sf_911_last_5_year.csv
            ${{ env.CRIME_DATA_DIR }}/sf_911_last_5_year_y.csv
            ${{ env.CRIME_DATA_DIR }}/sf_311_last_5_years.csv
            ${{ env.CRIME_DATA_DIR }}/sf_311_last_5_years_y.csv
            ${{ env.CRIME_DATA_DIR }}/sf_bus_stops_with_geoid.csv
            ${{ env.CRIME_DATA_DIR }}/sf_train_stops_with_geoid.csv
            ${{ env.CRIME_DATA_DIR }}/sf_pois_cleaned_with_geoid.csv
            ${{ env.CRIME_DATA_DIR }}/sf_weather_5years.csv
            ${{ env.CRIME_DATA_DIR }}/sf_weather_5years_y.csv
            ${{ env.CRIME_DATA_DIR }}/week.csv
            ${{ env.CRIME_DATA_DIR }}/*.geojson
            ${{ env.CRIME_DATA_DIR }}/sf_crime_09.parquet
            ${{ env.CRIME_DATA_DIR }}/sf_weather_5years.parquet
            ${{ env.CRIME_DATA_DIR }}/week.parquet

      - name: Upload week.csv & sf_crime_09.csv to Google Drive (OAuth via token)
        if: ${{ steps.gate.outputs.proceed == 'true' }}
        env:
          RCLONE_GDRIVE_TOKEN: ${{ secrets.RCLONE_GDRIVE_TOKEN }}
          CRIME_DATA_DIR: ${{ env.CRIME_DATA_DIR }}
          GDRIVE_FOLDER: ${{ env.GDRIVE_FOLDER }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Files check:"
          ls -lah "${CRIME_DATA_DIR}/week.csv"
          ls -lah "${CRIME_DATA_DIR}/sf_crime_09.csv"

          # rclone indir/kur (runner içine)
          curl -fsSL https://rclone.org/install.sh | sudo bash

          # OAuth token ile remote config oluştur (client_id/secret boş -> rclone default)
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [gdrive]
          type = drive
          token = ${RCLONE_GDRIVE_TOKEN}
          EOF

          echo "Remote test:"
          rclone lsd gdrive: || true

          # Hedef klasör yolu
          DEST="gdrive:${GDRIVE_FOLDER}"

          # Önce hedefte eski dosyaları sil (varsa)
          rclone deletefile "${DEST}/week.csv" || true
          rclone deletefile "${DEST}/sf_crime_09.csv" || true

          # Sonra yenisini yükle
          rclone copyto "${CRIME_DATA_DIR}/week.csv"       "${DEST}/week.csv"
          rclone copyto "${CRIME_DATA_DIR}/sf_crime_09.csv" "${DEST}/sf_crime_09.csv"

          rclone copyto "${CRIME_DATA_DIR}/week.parquet"        "${DEST}/week.parquet"        || true
          rclone copyto "${CRIME_DATA_DIR}/sf_crime_09.parquet" "${DEST}/sf_crime_09.parquet" || true

          echo "✅ Upload OK → ${DEST}"
          rclone ls "${DEST}" | tail -n 20 || true

